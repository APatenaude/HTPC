# A release of the TV box (launcher\dev\New-Release.ps1 makes the tag):
#   push of a tag v<major.minor.patch>  check the Tests workflow passed on that commit, build,
#                                       publish a GitHub release, then download it
#                                       again the way a box does and check every file
#   run by hand (workflow_dispatch)     a dry run: the files are kept as a workflow artifact only
#
# The box trusts whatever is published here (no signing key, the user's choice): see
# launcher/README.md, "Updates", for what that means. So the build has no write access at all,
# and only the short publishing job, on a tag, can write releases. Actions are pinned to commits.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # checkout leaves a lightweight copy of the tag; the annotated tag carries the notes.
      - name: Release notes from the tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          git tag -l --format='%(contents)' $env:TAG | Out-File -Encoding utf8 "$env:RUNNER_TEMP\notes.txt"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The checks run in the Tests workflow, on every push. A tag is only made on a commit where
      # they passed (launcher\dev\New-Release.ps1 waits for them), and this checks it again before
      # anything is built: a tag on a commit without a passed run publishes nothing.
      - name: Tests passed on this commit
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGGED: ${{ github.event_name == 'push' && github.ref_type == 'tag' && '1' || '' }}
        run: |
          $sha = git rev-parse HEAD
          $json = gh api "repos/$env:GH_REPO/actions/runs?head_sha=$sha&status=success&per_page=100"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $passed = @(($json | ConvertFrom-Json).workflow_runs | Where-Object { $_.path -like '.github/workflows/tests.yml*' })
          if ($passed.Count) { Write-Host "Tests passed on $($sha): $($passed[0].html_url)"; exit 0 }
          if ($env:TAGGED) { throw "The Tests workflow has not passed on $($sha): nothing is published. Tag a commit where it passed (New-Release.ps1 does)." }
          Write-Host "::warning::The Tests workflow has not passed on $($sha) (yet): a dry run builds anyway"

      - name: Build
        shell: powershell
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          $build = @{ Out = "$env:GITHUB_WORKSPACE\release" }
          if ($env:TAG) { $build.Tag = $env:TAG; $build.NotesFile = "$env:RUNNER_TEMP\notes.txt" }
          & .\launcher\dev\Build-Release.ps1 @build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          retention-days: 7
          if-no-files-found: error

  publish:
    # The build job checks first that the Tests workflow passed on this commit.
    needs: build
    # Only a pushed tag publishes; a run by hand is a dry run, even on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      - name: Publish the release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content release\update.json -Raw | ConvertFrom-Json
          $manifest.notes | Out-File -Encoding utf8 "$env:RUNNER_TEMP\notes.txt"
          # What an update from the TV applies and what it leaves to setup (setup/README.md).
          @(
            '',
            '---',
            'Updating from the TV (Settings > Updates) replaces the launcher, the watchdog, the job runner, the app catalog and the kept setup scripts, and applies again the machine part of the Edge and System setup steps when their scripts changed (the Edge policies, the HKLM system settings, the sign-in screen).',
            'It does not apply the signed-in user''s settings (HKCU), the phone remote''s HTTPS certificate or any other setup step: for those, run TV Box Setup again (setup/README.md, "What an update applies").'
          ) | Out-File -Append -Encoding utf8 "$env:RUNNER_TEMP\notes.txt"
          $files = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          # Not "latest" yet: boxes only look at releases/latest, so none sees it before the check.
          gh release create $env:TAG @files --verify-tag --latest=false --title "TV box $($manifest.version)" --notes-file "$env:RUNNER_TEMP\notes.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # What boxes will download, through GitHub's redirects, checked with the box's own code;
      # only then is it made "latest" (what boxes see). A mismatch deletes the release (the tag
      # stays, for a run again once fixed): no box ever saw it.
      - name: Check the release as a box would, then make it latest
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          try {
            & .\launcher\dev\Test-ReleaseAssets.ps1 -Tag $env:TAG -Repo $env:GH_REPO -Expected release
          } catch {
            gh release delete $env:TAG --yes
            throw
          }
          gh release edit $env:TAG --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
